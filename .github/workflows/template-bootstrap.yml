name: Initialize repository from template

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  initialize:
    if: github.repository_id != '1414443367' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: template-bootstrap-${{ github.repository_id }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - id: state
        name: Check whether this repository needs initialization
        shell: bash
        run: |
          if [[ -f .template-initialized ]]; then
            echo "initialized=true" >> "$GITHUB_OUTPUT"
          else
            echo "initialized=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-dotnet@v4
        if: steps.state.outputs.initialized == 'false'
        with:
          dotnet-version: 10.0.x
      - uses: azure/setup-helm@v4
        if: steps.state.outputs.initialized == 'false'
        with:
          version: v3.19.0
      - name: Initialize, build, test, and lint Helm chart
        if: steps.state.outputs.initialized == 'false'
        shell: pwsh
        env:
          REPOSITORY_NAME: ${{ github.event.repository.name }}
          REPOSITORY_ID: ${{ github.repository_id }}
        run: ./scripts/bootstrap-template.ps1 -RepositoryName $env:REPOSITORY_NAME -RepositoryId $env:REPOSITORY_ID
      - name: Commit initialized template
        if: steps.state.outputs.initialized == 'false'
        shell: bash
        run: |
          if [[ -f .template-initialized ]] && [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Initialize repository from template"
            git push
          else
            echo "No initialization changes to commit."
          fi
