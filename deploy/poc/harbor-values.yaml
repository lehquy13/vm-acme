expose:
  type: nodePort
  tls: {enabled: false}
  nodePort:
    name: harbor
    ports:
      http: {port: 80, nodePort: 30002}
externalURL: "" # supplied by bootstrap from the actual Minikube node address
existingSecretAdminPassword: vm-acme-harbor-admin
existingSecretAdminPasswordKey: HARBOR_ADMIN_PASSWORD
updateStrategy:
  type: Recreate
trivy: {enabled: false}
persistence:
  enabled: true
  resourcePolicy: keep
  persistentVolumeClaim:
    registry: {size: 5Gi}
    jobservice:
      jobLog: {size: 1Gi}
    database: {size: 1Gi}
    redis: {size: 1Gi}
nginx:
  resources:
    requests: {cpu: 50m, memory: 64Mi}
portal:
  resources:
    requests: {cpu: 50m, memory: 64Mi}
core:
  resources:
    requests: {cpu: 100m, memory: 128Mi}
jobservice:
  resources:
    requests: {cpu: 100m, memory: 128Mi}
registry:
  registry:
    resources:
      requests: {cpu: 100m, memory: 128Mi}
  controller:
    resources:
      requests: {cpu: 50m, memory: 64Mi}
