profile: common
# Deploy prerequisite identities as a separate release before the application.
phase: application
fullnameOverride: vm-acme
replicaCount: 1
image:
  repository: ""
  tag: ""
  pullPolicy: Always
imagePullSecrets: []
persistence:
  provider: PostgreSql
secrets:
  mode: AppSettings
  vaultUri: ""
  fallbackFile: /etc/vm-acme/secrets/appsettings.secrets.json
application:
  vaultConnectionSecret: ""
  vaultJwtSecret: ""
  serviceAccount: vm-acme-api
  connectionSecret: ""
  connectionKey: connection
  jwtSigningSecret: vm-acme-jwt
  jwtSigningKey: signing-key
  fallbackSecretName: ""
  jwtIssuer: vm-acme
  jwtAudience: vm-acme-api
  podLabels: {}
  podAnnotations: {}
  serviceAccountAnnotations: {}
migration:
  artifact: Runner
  vaultConnectionSecret: ""
  enabled: true
  orchestration: helm
  image:
    repository: ""
    tag: ""
  serviceAccount: vm-acme-migrator
  serviceAccountAnnotations: {}
  connectionSecret: ""
  connectionKey: connection
  fallbackSecretName: ""
  podLabels: {}
  podAnnotations: {}
  target: ""
  failForPoc: false
  activeDeadlineSeconds: 240
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: "1", memory: 512Mi}
resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits: {cpu: "1", memory: 512Mi}
service:
  type: ClusterIP
  port: 8080
ingress:
  enabled: false
  className: ""
  annotations: {}
  host: ""
  tls: []
securityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: {drop: [ALL]}
nodeSelector: {}
tolerations: []
affinity: {}
