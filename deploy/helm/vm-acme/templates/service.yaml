{{- if eq .Values.phase "application" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vm-acme.fullname" . }}
spec:
  type: {{ .Values.service.type }}
  selector: {{ include "vm-acme.labels" . | nindent 4 }}
  ports: [{name: http, port: {{ .Values.service.port }}, targetPort: http}]
{{- end }}
