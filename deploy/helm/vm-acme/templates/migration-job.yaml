{{- if and (eq .Values.phase "application") .Values.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "vm-acme.fullname" . }}-migrate
  annotations:
    {{- if eq .Values.migration.orchestration "helm" }}
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
    {{- else }}
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-10"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    {{- end }}
spec:
  backoffLimit: 0
  activeDeadlineSeconds: {{ .Values.migration.activeDeadlineSeconds }}
  template:
    metadata:
      labels: {{ toYaml .Values.migration.podLabels | nindent 8 }}
      annotations: {{ toYaml .Values.migration.podAnnotations | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.migration.serviceAccount }}
      restartPolicy: Never
      imagePullSecrets: {{ toYaml .Values.imagePullSecrets | nindent 8 }}
      securityContext: {seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: migrate
          image: "{{ .Values.migration.image.repository }}:{{ .Values.migration.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{ toYaml .Values.securityContext | nindent 12 }}
          resources: {{ toYaml .Values.migration.resources | nindent 12 }}
          env:
            {{- if eq .Values.migration.artifact "Bundle" }}
            - name: DOTNET_BUNDLE_EXTRACT_BASE_DIR
              value: /tmp/.net
            {{- end }}
            - name: Secrets__Mode
              value: {{ .Values.secrets.mode | quote }}
            {{- if and (ne .Values.secrets.mode "KeyVaultRequired") .Values.migration.fallbackSecretName }}
            - name: Secrets__FallbackFile
              value: {{ .Values.secrets.fallbackFile | quote }}
            {{- end }}
            {{- if ne .Values.secrets.mode "AppSettings" }}
            - name: Secrets__VaultUri
              value: {{ .Values.secrets.vaultUri | quote }}
            - name: Secrets__ConnectionSecret
              value: {{ .Values.migration.vaultConnectionSecret | quote }}
            {{- end }}
            - name: Persistence__Provider
              value: {{ .Values.persistence.provider | quote }}
            {{- if and (eq .Values.secrets.mode "AppSettings") (not .Values.migration.fallbackSecretName) }}
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.migration.connectionSecret }}
                  key: {{ .Values.migration.connectionKey }}
            {{- end }}
            - name: MIGRATION_TARGET
              value: {{ .Values.migration.target | quote }}
            - name: MIGRATION_TIMEOUT_SECONDS
              value: {{ sub .Values.migration.activeDeadlineSeconds 15 | quote }}
            - name: POC_MODE
              value: {{ eq .Values.profile "poc" | quote }}
            - name: POC_FAIL_MIGRATION
              value: {{ .Values.migration.failForPoc | quote }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            {{- if and (ne .Values.secrets.mode "KeyVaultRequired") .Values.migration.fallbackSecretName }}
            - {name: fallback-secrets, mountPath: /etc/vm-acme/secrets, readOnly: true}
            {{- end }}
      volumes:
        - {name: tmp, emptyDir: {}}
        {{- if and (ne .Values.secrets.mode "KeyVaultRequired") .Values.migration.fallbackSecretName }}
        - name: fallback-secrets
          secret:
            secretName: {{ .Values.migration.fallbackSecretName }}
            items:
              - key: appsettings.secrets.json
                path: appsettings.secrets.json
        {{- end }}
{{- end }}
